name: price-watcher tests

on:
  push:
    paths: ["price-watcher/**", "restaurant-orderer/**", ".github/workflows/price-watcher-tests.yml"]
  pull_request:
    paths: ["price-watcher/**", "restaurant-orderer/**", ".github/workflows/price-watcher-tests.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: price-watcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  restaurant-orderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: restaurant-orderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
