[project]
name = "price-watcher"
version = "0.1.0"
description = "Daily product price watcher that emails on change. Local-only, cross-platform."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "brotli>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "extruct>=0.17",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "filelock>=3.13",
    "playwright>=1.44",
]

[project.scripts]
price-watcher = "price_watcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_watcher"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
